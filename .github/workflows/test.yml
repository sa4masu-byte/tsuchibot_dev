name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tsuchibot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tsuchibot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsuchibot -d tsuchibot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TSUCHIBOT_TEST_DATABASE_URL: postgresql://tsuchibot:test-only-password@localhost:5432/tsuchibot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check backend worker
      - run: mypy
      - run: pytest
      - run: python -m worker.cli explore --mode incremental

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
